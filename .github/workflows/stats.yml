name: Atualizar estatísticas

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 6h (horário de Brasília)
  workflow_dispatch:       # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar cards
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_NOME: "Lucas Floripes"
          STATS_CARGO: ""
          STATS_EMPRESA: ""
        run: python scripts/gerar_stats.py
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats-*.svg
          git diff --staged --quiet || git commit -m "Atualiza estatísticas"
          git push
